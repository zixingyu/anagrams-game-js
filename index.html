<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Anagrams Game</title>
    <script src="anagrams.js"></script>
    <script defer src="script.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background-color: #f9f9f9;
            color: #333;
        }

        h1,
        h2,
        h3 {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        section {
            margin-bottom: 2rem;
            padding: 1rem;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        #letters-display {
            text-align: center;
            margin-bottom: 1rem;
        }

        #letters-display span {
            font-size: 2rem;
            padding: 0.5rem;
            margin: 0.3rem;
            border: 2px solid #444;
            display: inline-block;
            width: 2.2rem;
            height: 2.2rem;
            text-align: center;
            border-radius: 8px;
        }

        .letter {
            cursor: pointer;
            background-color: #f0f0f0;
            transition: background-color 0.2s;
        }

        .letter:hover {
            background-color: #d0d0d0;
        }

        .letter.used {
            background-color: #bcbcbc;
            pointer-events: none;
        }

        form {
            text-align: center;
            margin-bottom: 1rem;
        }

        input[type="text"] {
            padding: 0.6rem;
            font-size: 1rem;
            width: 200px;
            margin-right: 0.5rem;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            margin: 0.3rem;
            border: none;
            border-radius: 6px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        #feedback {
            text-align: center;
            font-weight: bold;
            margin-top: 1rem;
        }

        #grouped-words {
            padding-left: 1rem;
            line-height: 1.8;
        }

        #score {
            font-weight: bold;
        }

        ul {
            list-style: none;
            padding: 0;
            line-height: 1.6;
        }

        .disabled {
            pointer-events: none;
            opacity: 0.5;
        }

        #clear-btn {
            background-color: #e74c3c;
        }

        #clear-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>

<body>
    <h1>Anagrams Game</h1>

    <section id="game">
        <p id="instructions">Use the letters below to guess words:</p>
        <div id="letters-display"></div>

        <form id="guess-form">
            <input type="text" id="guess-input" required autocomplete="off" />
            <button type="submit">Submit Guess</button>
        </form>

        <div style="text-align: center;">
            <button id="shuffle-btn">Shuffle Letters</button>
            <button id="new-game-btn">New Game</button>
        </div>

        <p id="feedback"></p>

        <div id="guessed-words">
            <h3>Guessed Words</h3>
            <div id="grouped-words">
                <div><strong>3-letter:</strong> <span id="group-3"></span></div>
                <div><strong>4-letter:</strong> <span id="group-4"></span></div>
                <div><strong>5-letter:</strong> <span id="group-5"></span></div>
                <div><strong>6-letter:</strong> <span id="group-6"></span></div>
                <div><strong>7-letter:</strong> <span id="group-7"></span></div>
            </div>
        </div>

        <p style="text-align: center;">Score: <span id="score">0</span></p>
    </section>

    <section id="stats">
        <h2>Game Statistics</h2>
        <ul>
            <li>Games Played: <span id="games-played">0</span></li>
            <li>Highest Score: <span id="high-score">0</span></li>
            <li>Lowest Score: <span id="low-score">0</span></li>
            <li>Avg Correct: <span id="avg-correct">0</span></li>
            <li>Avg Incorrect: <span id="avg-incorrect">0</span></li>
        </ul>
    </section>

    <section>
        <div style="text-align: center;">
            <button id="clear-btn">Clear History</button>
        </div>
    </section>
</body>

</html>
